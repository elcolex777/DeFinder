<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeFinder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #1a1a1a;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
        }

        /* Область скрыта по умолчанию (display: none) */
        .preview-zone {
            display: none;
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #1e293b;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }

        #result-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary { background-color: #2563eb; color: #fff; }
        .btn-primary:hover { background-color: #1d4ed8; }

        /* Полностью скрытый системный тег */
        #camera-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>DeFinder</h1>
            <p class="subtitle">Поиск вещей по картинке</p>
        </div>

        <!-- Зона отображения фотографии (появляется только при наличии фото) -->
        <div class="preview-zone" id="preview-zone">
            <img id="result-image" alt="Снимок с камеры">
        </div>

        <!-- Панель интерактивных кнопок -->
        <div class="controls">
            <button id="capture-btn" class="btn-primary">Сделать снимок</button>
        </div>
    </div>

    <!-- Системный вызов: capture="environment" задействует ОСНОВНУЮ заднюю камеру смартфона -->
    <input type="file" id="camera-input" accept="image/*" capture="environment">

    <script>
        const cameraInput = document.getElementById('camera-input');
        const captureBtn = document.getElementById('capture-btn');
        const resultImage = document.getElementById('result-image');
        const previewZone = document.getElementById('preview-zone');

        // Логика нажатия на «Сделать снимок»
        captureBtn.addEventListener('click', () => {
            // Если на экране уже есть фото, сбрасываем интерфейс перед новым снимком
            if (resultImage.src && previewZone.style.display === 'flex') {
                
                // Освобождаем память от старой ссылки blob
                if (resultImage.src.startsWith('blob:')) {
                    URL.revokeObjectURL(resultImage.src);
                }
                
                // Сбрасываем значение инпута
                cameraInput.value = ''; 
                
                // Скрываем область превью обратно
                previewZone.style.display = 'none';
                resultImage.src = '';
            }
            
            // Открываем системную камеру
            cameraInput.click();
        });

        // Обработка сделанного снимка
        cameraInput.addEventListener('change', (event) => {
            const files = event.target.files;
            
            if (files && files.length > 0) {
                const file = files[0];
                
                // Создаем локальную ссылку на файл в памяти браузера
                const imageURL = URL.createObjectURL(file);
                
                // Показываем блок превью (flex вместо block для центрирования картинки)
                previewZone.style.display = 'flex';
                resultImage.src = imageURL;
                
                // Меняем текст кнопки для повторных снимков
                captureBtn.textContent = 'Сделать новый снимок';
            }
        });
    </script>
</body>
</html>
