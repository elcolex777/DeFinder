<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>DeFinder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
        }
        h1 {
            font-size: 26px;
            color: #1a1a1a;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -.5px;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
        }
        .preview-zone {
            display: none;
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #1e293b;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }
        #result-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color .2s, transform .1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        button:active {
            transform: scale(.98);
        }
        .btn-primary {
            background-color: #2563eb;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #64748b;
            color: #fff;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .settings-panel, .results-panel {
            display: none;
            flex-direction: column;
            gap: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .range-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .range-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }
        .range-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            outline: none;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .loader-container {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: none;
        }
        .message-error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .message-success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #86efac;
            text-align: center;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>DeFinder</h1>
            <p class="subtitle">Поиск вещей по картинке</p>
        </div>

        <div class="preview-zone" id="preview-zone">
            <canvas id="result-canvas"></canvas>
        </div>

        <div class="controls">
            <button id="capture-btn" class="btn-primary">📷 Сделать снимок</button>
            <button id="gallery-btn" class="btn-secondary">🖼️ Выбрать из галереи</button>
        </div>

        <div class="settings-panel" id="settings-panel">
            <div class="range-group">
                <div class="range-label">
                    <span>Порог уверенности (conf)</span>
                    <span id="conf-val">0.25</span>
                </div>
                <input type="range" id="conf-slider" class="range-slider" min="0.0" max="1.0" step="0.01" value="0.25">
            </div>

            <div class="range-group">
                <div class="range-label">
                    <span>Порог IoU для NMS</span>
                    <span id="iou-val">0.70</span>
                </div>
                <input type="range" id="iou-slider" class="range-slider" min="0.0" max="1.0" step="0.01" value="0.70">
            </div>

            <div class="range-group">
                <div class="range-label">
                    <span>Размер изображения (imgsz)</span>
                    <span id="imgsz-val">640</span>
                </div>
                <input type="range" id="imgsz-slider" class="range-slider" min="0" max="1024" step="80" value="640">
            </div>

            <div class="range-group">
                <div class="range-label">
                    <span>Мин. ширина объекта (min_width)</span>
                    <span id="minwidth-val">10</span>
                </div>
                <input type="range" id="minwidth-slider" class="range-slider" min="0" max="1000" step="10" value="10">
            </div>
        </div>

        <div class="results-panel" id="results-panel">
            <div class="loader-container" id="loader">
                <div class="spinner"></div>
                <span style="font-size:14px;color:#64748b;">Обработка масок...</span>
            </div>
            <div class="message message-error" id="error-message"></div>
            <div class="message message-success" id="success-message"></div>
        </div>
    </div>

    <!-- Скрытые инпуты для камеры и галереи -->
    <input type="file" id="camera-input" accept="image/*" capture="environment">
    <input type="file" id="gallery-input" accept="image/*">

    <!-- Подключение внешнего JS файла -->
    <script src="app.js"></script>

</body>
</html>
