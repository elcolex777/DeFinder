<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>DeFinder</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background-color:#f4f6f9;color:#333;display:flex;flex-direction:column;align-items:center;padding:30px 15px;min-height:100vh}.app-container{width:100%;max-width:480px;background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:20px}.header{text-align:center}h1{font-size:26px;color:#1a1a1a;margin-bottom:6px;font-weight:700;letter-spacing:-.5px}.subtitle{font-size:14px;color:#666}.preview-zone{display:none;position:relative;width:100%;aspect-ratio:4/3;background-color:#1e293b;border:2px solid #e2e8f0;border-radius:12px;overflow:hidden;align-items:center;justify-content:center}#result-canvas{width:100%;height:100%;object-fit:contain}.controls{display:flex;flex-direction:column;gap:15px}button{padding:14px 20px;font-size:15px;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:background-color .2s,transform .1s;display:inline-flex;align-items:center;justify-content:center;width:100%}button:active{transform:scale(.98)}.btn-primary{background-color:#2563eb;color:#fff}.btn-primary:hover{background-color:#1d4ed8}.settings-panel,.results-panel{display:none;flex-direction:column;gap:15px;background:#f8fafc;padding:15px;border-radius:12px;border:1px solid #e2e8f0}.range-group{display:flex;flex-direction:column;gap:6px}.range-label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:#475569}.range-slider{width:100%;height:8px;border-radius:4px;outline:none;accent-color:#2563eb;cursor:pointer}.loader-container{display:none;align-items:center;justify-content:center;gap:10px;padding:10px}.spinner{width:24px;height:24px;border:3px solid #e2e8f0;border-top:3px solid #2563eb;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}.message{padding:12px;border-radius:8px;font-size:14px;font-weight:500;line-height:1.4;display:none}.message-error{background-color:#fef2f2;color:#991b1b;border:1px solid #fca5a5}.message-success{background-color:#f0fdf4;color:#166534;border:1px solid #86efac;text-align:center}#camera-input{display:none}</style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>DeFinder</h1>
            <p class="subtitle">Поиск вещей по картинке</p>
        </div>

        <div class="preview-zone" id="preview-zone">
            <canvas id="result-canvas"></canvas>
        </div>

        <div class="controls">
            <button id="capture-btn" class="btn-primary">Сделать снимок</button>
        </div>

        <div class="settings-panel" id="settings-panel">
            <div class="range-group">
                <div class="range-label">
                    <span>Порог уверенности (conf)</span>
                    <span id="conf-val">0.25</span>
                </div>
                <input type="range" id="conf-slider" class="range-slider" min="0.0" max="1.0" step="0.01" value="0.25">
            </div>

            <div class="range-group">
                <div class="range-label">
                    <span>Порог IoU для NMS</span>
                    <span id="iou-val">0.70</span>
                </div>
                <input type="range" id="iou-slider" class="range-slider" min="0.0" max="1.0" step="0.01" value="0.70">
            </div>

            <div class="range-group">
                <div class="range-label">
                    <span>Размер изображения (imgsz)</span>
                    <span id="imgsz-val">320</span>
                </div>
                <input type="range" id="imgsz-slider" class="range-slider" min="0" max="1024" step="80" value="320">
            </div>

            <div class="range-group">
                <div class="range-label">
                    <span>Мин. ширина объекта (min_width)</span>
                    <span id="minwidth-val">10</span>
                </div>
                <input type="range" id="minwidth-slider" class="range-slider" min="0" max="1000" step="10" value="10">
            </div>
        </div>

        <div class="results-panel" id="results-panel">
            <div class="loader-container" id="loader">
                <div class="spinner"></div>
                <span style="font-size:14px;color:#64748b;">Обработка масок...</span>
            </div>
            <div class="message message-error" id="error-message"></div>
            <div class="message message-success" id="success-message"></div>
        </div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment">

    <script>
        // --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ СЕРВИСА ---
        const BASE_URL = 'http://46.16.36.127:8001';
        // -------------------------------------

        const cameraInput=document.getElementById("camera-input"),captureBtn=document.getElementById("capture-btn"),resultCanvas=document.getElementById("result-canvas"),previewZone=document.getElementById("preview-zone"),settingsPanel=document.getElementById("settings-panel"),resultsPanel=document.getElementById("results-panel"),confSlider=document.getElementById("conf-slider"),iouSlider=document.getElementById("iou-slider"),confVal=document.getElementById("conf-val"),iouVal=document.getElementById("iou-val"),imgszSlider=document.getElementById("imgsz-slider"),imgszVal=document.getElementById("imgsz-val"),minwidthSlider=document.getElementById("minwidth-slider"),minwidthVal=document.getElementById("minwidth-val"),loader=document.getElementById("loader"),errorMessage=document.getElementById("error-message"),successMessage=document.getElementById("success-message");let originalImageElement=null,lastImgBlobUrl=null;captureBtn.addEventListener("click",function(){if(lastImgBlobUrl){URL.revokeObjectURL(lastImgBlobUrl);lastImgBlobUrl=null}cameraInput.value="";previewZone.style.display="none";settingsPanel.style.display="none";resultsPanel.style.display="none";originalImageElement=null;cameraInput.click()});cameraInput.addEventListener("change",function(e){const t=e.target.files;if(t&&t.length>0){const e=t[0];lastImgBlobUrl=URL.createObjectURL(e);previewZone.style.display="flex";captureBtn.textContent="Сделать новый снимок";settingsPanel.style.display="flex";resultsPanel.style.display="flex";originalImageElement=new Image();originalImageElement.onload=function(){resultCanvas.width=originalImageElement.width;resultCanvas.height=originalImageElement.height;resultCanvas.getContext("2d").drawImage(originalImageElement,0,0);sendMasksRequest()};originalImageElement.src=lastImgBlobUrl}});confSlider.addEventListener("input",(()=>confVal.textContent=parseFloat(confSlider.value).toFixed(2)));iouSlider.addEventListener("input",(()=>iouVal.textContent=parseFloat(iouSlider.value).toFixed(2)));imgszSlider.addEventListener("input",(()=>imgszVal.textContent=parseInt(imgszSlider.value,10)));minwidthSlider.addEventListener("input",(()=>minwidthVal.textContent=parseInt(minwidthSlider.value,10)));confSlider.addEventListener("change",(()=>{originalImageElement&&sendMasksRequest()}));iouSlider.addEventListener("change",(()=>{originalImageElement&&sendMasksRequest()}));imgszSlider.addEventListener("change",(()=>{originalImageElement&&sendMasksRequest()}));minwidthSlider.addEventListener("change",(()=>{originalImageElement&&sendMasksRequest()}));function processAndGetBase64(e){if(!originalImageElement)return null;let t=originalImageElement.width,l=originalImageElement.height;if(e>0&&t>e){const a=e/t;t=e;l=Math.round(l*a)}const a=document.createElement("canvas");a.width=t;a.height=l;a.getContext("2d").drawImage(originalImageElement,0,0,t,l);return{base64:a.toDataURL("image/jpeg",.85).split(",")[1],w:t,h:l}}function drawMaskBorders(e,t,l){const a=resultCanvas.getContext("2d");a.clearRect(0,0,resultCanvas.width,resultCanvas.height);a.drawImage(originalImageElement,0,0,resultCanvas.width,resultCanvas.height);const n=resultCanvas.width/t,s=resultCanvas.height/l;e.forEach((e=>{let r=0;const o=new Uint8Array(t*l);for(let t=0;t<e.length;t++){const l=e[t],a=t%2==1?1:0;for(let e=0;e<l;e++)o[r++]=a}a.lineWidth=3;a.strokeStyle=`hsl(${Math.floor(360*Math.random())},100%,50%)`;a.beginPath();for(let e=0;e<l;e++){for(let r=0;r<t;r++){if(o[e*t+r]===1){let i=r<=0||o[e*t+r-1]!==1;let c=r>=t-1||o[e*t+r+1]!==1;let d=e<=0||o[(e-1)*t+r]!==1;let g=e>=l-1||o[(e+1)*t+r]!==1;if(i||c||d||g){a.rect(r*n,e*s,n,s)}}}}a.stroke()}))}async function sendMasksRequest(){if(!originalImageElement)return;const e=parseInt(imgszSlider.value,10),t=processAndGetBase64(e);if(!t)return;loader.style.display="flex";errorMessage.style.display="none";successMessage.style.display="none";const l={image_base64:t.base64,conf_threshold:parseFloat(confSlider.value),iou_threshold:parseFloat(iouSlider.value),imgsz:e,min_width:parseFloat(minwidthSlider.value)};try{const e=await fetch(`${BASE_URL}/api/v1/masks/predict`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(l)});if(!e.ok)throw new Error(`Ошибка сервера: ${e.status} ${e.statusText}`);const a=await e.json();if(!a||!Array.isArray(a.masks))throw new Error("Неверный формат ответа");const n=a.masks.length;successMessage.textContent=`Успешно получено масок: ${n}`;successMessage.style.display="block";drawMaskBorders(a.masks,t.w,t.h)}catch(e){errorMessage.textContent=`Не удалось получить маски: ${e.message}`;errorMessage.style.display="block"}finally{loader.style.display="none"}}</script>
</body>
</html>
